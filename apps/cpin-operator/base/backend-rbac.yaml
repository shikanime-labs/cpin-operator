# Backend credential template + consolidated RBAC for the cpin-operator plane.
# ponytail: file:// backend for local/dev only — set a real backend URL
# (Pulumi Cloud / S3 / azblob) per Stack in production; this secret then only
# carries PULUMI_CONFIG_PASSPHRASE (still needed for local state encryption).
apiVersion: v1
kind: Secret
metadata:
  name: pulumi-passphrase
type: Opaque
stringData:
  PULUMI_CONFIG_PASSPHRASE: replace-me
---
# kro needs rights over the API groups it orchestrates (CPN Project + Pulumi)
# and the workspace agent needs TokenReview (PKO grpc auth).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kro:cpin-orchestrator
rules:
- apiGroups: ["cpin.shikanime.studio", "pulumi.com"]
  resources: ["*"]
  verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kro:cpin-orchestrator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kro:cpin-orchestrator
subjects:
- kind: ServiceAccount
  name: kro
  namespace: kro-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: default:default:system:auth-delegator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
- kind: ServiceAccount
  name: default
  namespace: default
