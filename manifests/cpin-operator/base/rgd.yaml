apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: cpin-cluster
spec:
  schema:
    group: cloud-pi-native.fr
    apiVersion: v1alpha1
    kind: Cluster
    scope: Cluster
    spec:
      label: string
      privacy: string | default="public"
      secretName: string
      zoneRef:
        group: string
        kind: string
        name: string
      memory: integer | default=0
      cpu: integer | default=0
      gpu: integer | default=0
    status: {}
  resources: []
---
apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: cpin-environment
spec:
  schema:
    group: cloud-pi-native.fr
    apiVersion: v1alpha1
    kind: Environment
    scope: Namespaced
    spec:
      projectRef:
        group: string
        kind: string
        name: string
      clusterRef:
        group: string
        kind: string
        name: string
      stageRef:
        group: string
        kind: string
        name: string
      resources:
        requests:
          cpu: string
          memory: string
          gpu: integer | default=0
    status: {}
  resources: []
---
apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: cpin-integration
spec:
  schema:
    group: cloud-pi-native.fr
    apiVersion: v1alpha1
    kind: Integration
    scope: Namespaced
    spec:
      projectRef:
        group: string
        kind: string
        name: string
      service: string
      programRef:
        group: string
        kind: string
        name: string
    status:
      state: ${stack.status.?lastUpdate.?state.orValue("Pending")}
  resources:
  - id: project
    externalRef:
      apiVersion: cloud-pi-native.fr/v1alpha1
      kind: Project
      metadata:
        name: ${schema.spec.projectRef.name}
        namespace: ${schema.metadata.namespace}
  - id: roles
    externalRef:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: Role
      metadata:
        selector:
          matchExpressions:
          - key: cloud-pi-native.fr/project
            operator: In
            values:
            - ${schema.spec.projectRef.name}
  - id: environments
    externalRef:
      apiVersion: cloud-pi-native.fr/v1alpha1
      kind: Environment
      metadata:
        selector:
          matchExpressions:
          - key: cloud-pi-native.fr/project
            operator: In
            values:
            - ${schema.spec.projectRef.name}
  - id: stack
    template:
      apiVersion: pulumi.com/v1
      kind: Stack
      metadata:
        name: ${schema.spec.projectRef.name}-${schema.spec.service}
      spec:
        backend: file:///share
        stack: ${schema.spec.projectRef.name}-${schema.spec.service}
        programRef:
          name: ${schema.spec.programRef.name}
        config:
          projectName: ${schema.spec.projectRef.name}
          projectSlug: ${project.spec.slug}
          projectOwner: ${project.spec.owner}
          roles: ${roles.map(r, r.metadata.name).join(",")}
          environments: ${environments.map(e, e.metadata.name + "@" + e.spec.clusterRef.name).join(",")}
        envRefs:
          PULUMI_CONFIG_PASSPHRASE:
            type: Secret
            secret:
              name: pulumi-passphrase
              key: PULUMI_CONFIG_PASSPHRASE
        destroyOnFinalize: true
        resyncFrequencySeconds: 300
---
apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: cpin-project-secret
spec:
  schema:
    group: cloud-pi-native.fr
    apiVersion: v1alpha1
    kind: ProjectSecret
    scope: Namespaced
    spec:
      projectRef:
        group: string
        kind: string
        name: string
      key: string
      value: string
    status: {}
  resources: []
---
apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: cpin-project
spec:
  schema:
    group: cloud-pi-native.fr
    apiVersion: v1alpha1
    kind: Project
    scope: Namespaced
    spec:
      slug: string
      owner: string
      description: string
    status:
      services: ${services.map(s, s.spec.service).join(",")}
      roles: ${roles.map(r, r.metadata.name).join(",")}
      roleBindings: ${bindings.map(b, b.metadata.name).join(",")}
      environments: ${environments.map(e, e.metadata.name).join(",")}
  resources:
  - id: services
    externalRef:
      apiVersion: cloud-pi-native.fr/v1alpha1
      kind: Integration
      metadata:
        selector:
          matchExpressions:
          - key: cloud-pi-native.fr/project
            operator: In
            values:
            - ${schema.metadata.name}
  - id: roles
    externalRef:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: Role
      metadata:
        selector:
          matchExpressions:
          - key: cloud-pi-native.fr/project
            operator: In
            values:
            - ${schema.metadata.name}
  - id: environments
    externalRef:
      apiVersion: cloud-pi-native.fr/v1alpha1
      kind: Environment
      metadata:
        selector:
          matchExpressions:
          - key: cloud-pi-native.fr/project
            operator: In
            values:
            - ${schema.metadata.name}
  - id: bindings
    externalRef:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        selector:
          matchExpressions:
          - key: cloud-pi-native.fr/project
            operator: In
            values:
            - ${schema.metadata.name}
---
apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: cpin-stage
spec:
  schema:
    group: cloud-pi-native.fr
    apiVersion: v1alpha1
    kind: Stage
    scope: Cluster
    spec: {}
    status: {}
  resources: []
---
apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: cpin-zone
spec:
  schema:
    group: cloud-pi-native.fr
    apiVersion: v1alpha1
    kind: Zone
    scope: Cluster
    spec:
      slug: string | maxLength=10
      label: string
      description: string | default=""
      argocdUrl: string
    status: {}
  resources: []
