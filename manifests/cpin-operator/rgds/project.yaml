apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: cpin-project
spec:
  schema:
    group: cloud-pi-native.fr
    apiVersion: v1alpha1
    kind: Project
    scope: Namespaced
    spec:
      slug: string
      owner: string
      description: string
    status:
      services: ${services.map(s, s.spec.service).join(",")}
      roles: ${roles.map(r, r.metadata.name).join(",")}
      roleBindings: ${bindings.map(b, b.metadata.name).join(",")}
      environments: ${environments.map(e, e.metadata.name).join(",")}
  resources:
  - id: services
    externalRef:
      apiVersion: cloud-pi-native.fr/v1alpha1
      kind: Integration
      metadata:
        selector:
          matchExpressions:
          - key: cloud-pi-native.fr/project
            operator: In
            values:
            - ${schema.metadata.name}
  - id: roles
    externalRef:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: Role
      metadata:
        selector:
          matchExpressions:
          - key: cloud-pi-native.fr/project
            operator: In
            values:
            - ${schema.metadata.name}
  - id: environments
    externalRef:
      apiVersion: cloud-pi-native.fr/v1alpha1
      kind: Environment
      metadata:
        selector:
          matchExpressions:
          - key: cloud-pi-native.fr/project
            operator: In
            values:
            - ${schema.metadata.name}
  - id: bindings
    externalRef:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        selector:
          matchExpressions:
          - key: cloud-pi-native.fr/project
            operator: In
            values:
            - ${schema.metadata.name}
