# Pulumi state passphrase; file:// backend POC — see rbac.yaml note
# Backend credential template + consolidated RBAC for the cpin-operator plane.
# ponytail: file:// backend for local/dev only — set a real backend URL
# (Pulumi Cloud / S3 / azblob) per Stack in production; this secret then only
# carries PULUMI_CONFIG_PASSPHRASE (still needed for local state encryption).
apiVersion: v1
kind: Secret
metadata:
  name: pulumi-passphrase
type: Opaque
stringData:
  PULUMI_CONFIG_PASSPHRASE: replace-me
