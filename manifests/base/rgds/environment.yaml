apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: cpin-environment
spec:
  schema:
    group: cloud-pi-native.fr
    apiVersion: v1alpha1
    kind: Environment
    scope: Namespaced
    spec:
      projectRef:
        group: string
        kind: string
        name: string
      clusterRef:
        group: string
        kind: string
        name: string
      stageRef:
        group: string
        kind: string
        name: string
      resources:
        requests:
          cpu: string
          memory: string
          gpu: integer | default=0
    status: {}
  resources: []
