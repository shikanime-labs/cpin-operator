apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: cpin-zone
spec:
  schema:
    group: cloud-pi-native.fr
    apiVersion: v1alpha1
    kind: Zone
    scope: Cluster
    spec:
      slug: string | maxLength=10
      label: string
      description: string | default=""
      argocdUrl: string
    status:
      state: ${stack.status.?state.orValue("Pending")}
  resources:
  - id: stack
    template:
      apiVersion: pulumi.com/v1
      kind: Stack
      metadata:
        name: zone-${schema.metadata.name}
        namespace: default
      spec:
        backend: file:///share
        stack: zone-${schema.metadata.name}
        programRef:
          name: cpin-program-zone
        config:
          domain: ${schema.spec.argocdUrl}
        envRefs:
          PULUMI_CONFIG_PASSPHRASE:
            type: Secret
            secret:
              name: pulumi-passphrase
              key: PULUMI_CONFIG_PASSPHRASE
        destroyOnFinalize: true
        resyncFrequencySeconds: 300
