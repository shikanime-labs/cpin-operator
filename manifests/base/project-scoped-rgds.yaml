# Console project-scoped entities as separate CRDs for fine-grained RBAC
# (apps/server-nestjs/src/modules/project-* parity): ProjectRolesService,
# ProjectMembersService, ProjectServicesService, ProjectSecretsService,
# EnvironmentService. Each namespaced, linked to its Project by name.
# ponytail: SimpleSchema = flat scalars only (kro v0.9) — collections are
# JSON strings; no admission CEL until kro markers are proven on-cluster.
apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: cpin-project-role
spec:
  schema:
    group: cpin.shikanime.studio
    apiVersion: v1alpha1
    kind: ProjectRole
    scope: Namespaced
    spec:
      project: string
      name: string
      oidcGroupSuffix: string
      permissions: integer
      position: integer
    status: {}
  resources: []
---
apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: cpin-project-member
spec:
  schema:
    group: cpin.shikanime.studio
    apiVersion: v1alpha1
    kind: ProjectMember
    scope: Namespaced
    spec:
      project: string
      email: string
      roles: string
    status: {}
  resources: []
---
apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: cpin-project-service
spec:
  schema:
    group: cpin.shikanime.studio
    apiVersion: v1alpha1
    kind: ProjectService
    scope: Namespaced
    spec:
      project: string
      service: string
      enabled: boolean
    status: {}
  resources: []
---
apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: cpin-project-secret
spec:
  schema:
    group: cpin.shikanime.studio
    apiVersion: v1alpha1
    kind: ProjectSecret
    scope: Namespaced
    spec:
      project: string
      key: string
      value: string
    status: {}
  resources: []
---
apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: cpin-environment
spec:
  schema:
    group: cpin.shikanime.studio
    apiVersion: v1alpha1
    kind: Environment
    scope: Namespaced
    spec:
      project: string
      name: string
      cluster: string
      stage: string
      quota: string
    status: {}
  resources: []
