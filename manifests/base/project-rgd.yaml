# Project RGD: project-level identity — services fan out to one Pulumi Stack
# per service (independent state and lifecycle). Roles/members/environments
# live in their own CRDs; Program config receives their JSON aggregate.
# ponytail: SimpleSchema (kro v0.9) accepts flat scalar fields only and chokes
# on quoted-JSON defaults — aggregates are plain strings, forEach unrolls
# services via CEL split(). Revisit when kro gains list-typed fields.
apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: cpin-project
spec:
  schema:
    group: cpin.shikanime.studio
    apiVersion: v1alpha1
    kind: Project
    scope: Namespaced
    spec:
      name: string
      slug: string
      owner: string
      description: string
      services: string
      roles: string
      members: string
      environments: string
    status:
      services: ${schema.spec.services}
  resources:
    - id: stacks
      forEach:
        - service: ${schema.spec.services.split(",")}
      template:
        apiVersion: pulumi.com/v1
        kind: Stack
        metadata:
          name: ${schema.metadata.name}-${service}
        spec:
          backend: file:///share
          stack: ${schema.metadata.name}-${service}
          programRef:
            name: cpin-program-${service}
          config:
            projectName: ${schema.spec.name}
            projectSlug: ${schema.spec.slug}
            projectOwner: ${schema.spec.owner}
            roles: ${schema.spec.roles}
            members: ${schema.spec.members}
            environments: ${schema.spec.environments}
          envRefs:
            PULUMI_CONFIG_PASSPHRASE:
              type: Secret
              secret:
                name: pulumi-passphrase
                key: PULUMI_CONFIG_PASSPHRASE
          destroyOnFinalize: true
          resyncFrequencySeconds: 300
