# kro needs rights over the API groups it orchestrates (CPN Project + Pulumi)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kro:cpin-orchestrator
rules:
- apiGroups: ["cpin.shikanime.studio", "pulumi.com"]
  resources: ["*"]
  verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kro:cpin-orchestrator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kro:cpin-orchestrator
subjects:
- kind: ServiceAccount
  name: kro
  namespace: kro-system
