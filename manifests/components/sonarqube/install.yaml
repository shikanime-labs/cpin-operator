apiVersion: pulumi.com/v1
kind: Program
metadata:
  name: cpin-program-sonarqube-install
program:
  name: cpin-sonarqube-install
  runtime: yaml
  resources:
    sonarqube:
      type: kubernetes:helm.sh/v3:Release
      properties:
        name: sonarqube
        namespace: sonarqube
        repositoryOpts:
          repo: https://sonarsource.github.io/helm-chart-sonarqube/
        chart: sonarqube
        version: ${sonarqubeVersion}
  config:
    sonarqubeVersion:
      type: String
