apiVersion: pulumi.com/v1
kind: Program
metadata:
  name: cpin-program-certmanager
program:
  name: cpin-certmanager
  description: "certManager install plane \u2014 carved from the socle mega-program"
  runtime: yaml
  config:
    domain:
      type: String
    certManagerVersion:
      type: String
      default: 1.14.3
  resources:
    certManager:
      type: kubernetes:helm.sh/v3:Release
      properties:
        name: cert-manager
        namespace: cert-manager
        repositoryOpts:
          repo: https://charts.jetstack.io
        chart: cert-manager
        version: ${certManagerVersion}
