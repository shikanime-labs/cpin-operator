apiVersion: pulumi.com/v1
kind: Program
metadata:
  name: cpin-program-socle
program:
  name: cpin-socle
  description: "Socle install plane \u2014 helm releases replacing cloud-pi-native/socle\
    \ Ansible"
  runtime: yaml
  config:
    domain:
      type: String
    argocdVersion:
      type: String
      default: 8.5.6
    certManagerVersion:
      type: String
      default: 1.14.3
    cnpgVersion:
      type: String
      default: 0.27.0
    gitlabVersion:
      type: String
      default: 9.4.1
    glexporterVersion:
      type: String
      default: 0.3.5
    harborVersion:
      type: String
      default: 1.16.0
    keycloakVersion:
      type: String
      default: 25.2.0
    kyvernoVersion:
      type: String
      default: 3.1.4
    nexusVersion:
      type: String
      default: 5.14.0
    sonarqubeVersion:
      type: String
      default: 10.8.1
    vaultVersion:
      type: String
      default: 0.29.1
    prometheusVersion:
      type: String
      default: ''
  resources:
    certManager:
      type: kubernetes:helm.sh/v3:Release
      properties:
        name: cert-manager
        namespace: cert-manager
        repositoryOpts:
          repo: https://charts.jetstack.io
        chart: cert-manager
        version: ${certManagerVersion}
    kyverno:
      type: kubernetes:helm.sh/v3:Release
      properties:
        name: kyverno
        namespace: kyverno
        repositoryOpts:
          repo: https://kyverno.github.io/kyverno/
        chart: kyverno
        version: ${kyvernoVersion}
    cnpg:
      type: kubernetes:helm.sh/v3:Release
      properties:
        name: cloudnative-pg
        namespace: cnpg-system
        repositoryOpts:
          repo: https://cloudnative-pg.github.io/charts
        chart: cloudnative-pg
        version: ${cnpgVersion}
    gitlab:
      type: kubernetes:helm.sh/v3:Release
      properties:
        name: gitlab
        namespace: gitlab
        repositoryOpts:
          repo: https://charts.gitlab.io
        chart: gitlab
        version: ${gitlabVersion}
    glexporter:
      type: kubernetes:helm.sh/v3:Release
      properties:
        name: gitlab-ci-pipelines-exporter
        namespace: monitoring
        repositoryOpts:
          repo: https://charts.visonneau.ca
        chart: gitlab-ci-pipelines-exporter
        version: ${glexporterVersion}
    keycloak:
      type: kubernetes:helm.sh/v3:Release
      properties:
        name: keycloak
        namespace: keycloak
        repositoryOpts:
          repo: https://charts.bitnami.com/bitnami
        chart: keycloak
        version: ${keycloakVersion}
    harbor:
      type: kubernetes:helm.sh/v3:Release
      properties:
        name: harbor
        namespace: harbor
        repositoryOpts:
          repo: https://helm.goharbor.io
        chart: harbor
        version: ${harborVersion}
    nexus:
      type: kubernetes:helm.sh/v3:Release
      properties:
        name: nexus3
        namespace: nexus
        repositoryOpts:
          repo: https://stevehipwell.github.io/helm-charts/
        chart: nexus3
        version: ${nexusVersion}
    sonarqube:
      type: kubernetes:helm.sh/v3:Release
      properties:
        name: sonarqube
        namespace: sonarqube
        repositoryOpts:
          repo: https://sonarsource.github.io/helm-chart-sonarqube/
        chart: sonarqube
        version: ${sonarqubeVersion}
    vault:
      type: kubernetes:helm.sh/v3:Release
      properties:
        name: vault
        namespace: vault
        repositoryOpts:
          repo: https://helm.releases.hashicorp.com
        chart: vault
        version: ${vaultVersion}
    argocd:
      type: kubernetes:helm.sh/v3:Release
      properties:
        name: argocd
        namespace: argocd
        repositoryOpts:
          repo: https://argoproj.github.io/argo-helm
        chart: argo-cd
        version: ${argocdVersion}
    prometheus:
      type: kubernetes:helm.sh/v3:Release
      properties:
        name: kube-prometheus-stack
        namespace: monitoring
        repositoryOpts:
          repo: https://prometheus-community.github.io/helm-charts
        chart: kube-prometheus-stack
        version: ${prometheusVersion}
  outputs:
    releases:
    - cert-manager
    - kyverno
    - cloudnative-pg
    - gitlab
    - gitlab-ci-pipelines-exporter
    - keycloak
    - harbor
    - nexus3
    - sonarqube
    - vault
    - argocd
    - kube-prometheus-stack
