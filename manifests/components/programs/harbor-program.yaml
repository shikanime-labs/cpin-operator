apiVersion: pulumi.com/v1
kind: Program
metadata:
  name: cpin-program-harbor
program:
  name: cpin-harbor
  runtime: yaml
  description: Harbor registry provisioning from the console registry audit
  config:
    projectName:
      type: String
    projectSlug:
      type: String
    projectOwner:
      type: String
  variables:
    storageQuotaBytes: -1
    robotExpirationDays: 90
    retentionTemplate: latestPushedK
    retentionCount: 10
    retentionCron: 0 22 2 * * *
    roAccess:
    - resource: repository
      action: pull
    - resource: artifact
      action: read
    rwAccess:
    - resource: repository
      action: pull
    - resource: artifact
      action: read
    - resource: repository
      action: list
    - resource: tag
      action: list
    - resource: artifact
      action: list
    - resource: scan
      action: create
    - resource: scan
      action: stop
    - resource: repository
      action: push
    - resource: artifact-label
      action: create
    - resource: artifact-label
      action: delete
    - resource: tag
      action: create
    - resource: tag
      action: delete
    robotRoFullName:
      fn::join:
      - ''
      - - robot$
        - ${projectSlug}
        - +ro-robot
    robotRwFullName:
      fn::join:
      - ''
      - - robot$
        - ${projectSlug}
        - +rw-robot
    groupMappings:
    - group: /console/admin
      roleId: 1
    - group: /console/security
      roleId: 3
    - group: /console/readonly
      roleId: 3
    - group: /${projectSlug}
      roleId: 5
    - group: /${projectSlug}/console/admin
      roleId: 2
    - group: /${projectSlug}/console/devops
      roleId: 3
    - group: /${projectSlug}/console/developer
      roleId: 3
    - group: /${projectSlug}/console/security
      roleId: 3
    - group: /${projectSlug}/console/readonly
      roleId: 3
  resources:
    project:
      type: cpin:harbor:Artifact
      properties:
        kind: project
        name: ${projectSlug}
        owner: ${projectOwner}
        storageQuotaBytes: ${storageQuotaBytes}
    robotRo:
      type: cpin:harbor:Artifact
      properties:
        kind: robot
        name: ro-robot
        fullName: ${robotRoFullName}
        description: robot for ci builds
        level: project
        namespace: ${projectSlug}
        durationDays: ${robotExpirationDays}
        access: ${roAccess}
    robotRw:
      type: cpin:harbor:Artifact
      properties:
        kind: robot
        name: rw-robot
        fullName: ${robotRwFullName}
        description: robot for ci builds
        level: project
        namespace: ${projectSlug}
        durationDays: ${robotExpirationDays}
        access: ${rwAccess}
    retention:
      type: cpin:harbor:Artifact
      properties:
        kind: retention
        algorithm: or
        scope:
          level: project
          ref: ${project.id}
        rules:
        - action: retain
          disabled: false
          template: ${retentionTemplate}
          params:
            latestPushedK: ${retentionCount}
          tag_selectors:
          - kind: doublestar
            decoration: matches
            pattern: '**'
          scope_selectors:
            repository:
            - kind: doublestar
              decoration: repoMatches
              pattern: '**'
        trigger:
          kind: Schedule
          settings:
            cron: ${retentionCron}
          references: []
    groupMembers:
      type: cpin:harbor:Artifact
      properties:
        kind: group-members
        project: ${projectSlug}
        groupType: 3
        members: ${groupMappings}
  outputs:
    service: harbor
    projectId: ${project.id}
    robotAccounts:
    - ${robotRoFullName}
    - ${robotRwFullName}
    groupMappings: ${groupMappings}
