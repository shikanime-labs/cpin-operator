apiVersion: pulumi.com/v1
kind: Program
metadata:
  name: cpin-program-keycloak
program:
  configuration:
    projectName:
      type: String
    projectSlug:
      type: String
    projectOwner:
      type: String
  resources:
    topGroup:
      type: random:RandomPet
      properties:
        separator: '-'
    consoleGroup:
      type: random:RandomPet
      properties:
        separator: '-'
    roleGroups:
      type: random:RandomString
      properties:
        length: 24
        special: false
        upper: false
    installKeycloak:
      type: kubernetes:helm.sh/v3:Release
      properties:
        name: keycloak
        namespace: keycloak
        repositoryOpts:
          repo: https://charts.bitnami.com/bitnami
        chart: keycloak
        version: ${keycloakVersion}
  outputs:
    groupPaths: '[/${projectSlug}, /${projectSlug}/console, ...roles]'
