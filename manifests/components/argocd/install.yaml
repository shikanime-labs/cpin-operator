apiVersion: pulumi.com/v1
kind: Program
metadata:
  name: cpin-program-argocd-install
program:
  name: cpin-argocd-install
  runtime: yaml
  resources:
    argocd:
      type: kubernetes:helm.sh/v3:Release
      properties:
        name: argocd
        namespace: argocd
        repositoryOpts:
          repo: https://argoproj.github.io/argo-helm
        chart: argo-cd
        version: 8.5.6
