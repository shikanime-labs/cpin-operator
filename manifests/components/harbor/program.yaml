# harbor stand-in on the random provider; real provider when credentials land
apiVersion: pulumi.com/v1
kind: Program
metadata:
  name: cpin-program-harbor
program:
  configuration:
    projectName:
      type: String
    projectSlug:
      type: String
    projectOwner:
      type: String
  resources:
    robotRo:
      type: random:RandomPassword
      properties:
        length: 24
        special: false
        upper: false
    robotRw:
      type: random:RandomPassword
      properties:
        length: 24
        special: false
        upper: false
    retentionId:
      type: random:RandomInteger
      properties:
        min: 1
        max: 100
  outputs:
    robots: ro+rw
    retention: latestPushedK=10
