apiVersion: pulumi.com/v1
kind: Program
metadata:
  name: cpin-program-harbor
program:
  configuration:
    projectName:
      type: String
    projectSlug:
      type: String
    projectOwner:
      type: String
  resources:
    robotRo:
      type: random:RandomPassword
      properties:
        length: 24
        special: false
        upper: false
    robotRw:
      type: random:RandomPassword
      properties:
        length: 24
        special: false
        upper: false
    retentionId:
      type: random:RandomInteger
      properties:
        min: 1
        max: 100
    installHarbor:
      type: kubernetes:helm.sh/v3:Release
      properties:
        name: harbor
        namespace: harbor
        repositoryOpts:
          repo: https://helm.goharbor.io
        chart: harbor
        version: ${harborVersion}
  outputs:
    robots: ro+rw
    retention: latestPushedK=10
