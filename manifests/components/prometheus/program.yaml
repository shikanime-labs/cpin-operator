apiVersion: pulumi.com/v1
kind: Program
metadata:
  name: cpin-program-prometheus
program:
  name: cpin-prometheus
  description: "prometheus install plane \u2014 carved from the socle mega-program"
  runtime: yaml
  config:
    domain:
      type: String
    prometheusVersion:
      type: String
      default: ''
  resources:
    prometheus:
      type: kubernetes:helm.sh/v3:Release
      properties:
        name: kube-prometheus-stack
        namespace: monitoring
        repositoryOpts:
          repo: https://prometheus-community.github.io/helm-charts
        chart: kube-prometheus-stack
        version: ${prometheusVersion}
