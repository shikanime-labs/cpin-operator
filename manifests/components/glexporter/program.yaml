apiVersion: pulumi.com/v1
kind: Program
metadata:
  name: cpin-program-glexporter
program:
  name: cpin-glexporter
  description: "glexporter install plane \u2014 carved from the socle mega-program"
  runtime: yaml
  config:
    domain:
      type: String
    glexporterVersion:
      type: String
      default: 0.3.5
  resources:
    glexporter:
      type: kubernetes:helm.sh/v3:Release
      properties:
        name: gitlab-ci-pipelines-exporter
        namespace: monitoring
        repositoryOpts:
          repo: https://charts.visonneau.ca
        chart: gitlab-ci-pipelines-exporter
        version: ${glexporterVersion}
