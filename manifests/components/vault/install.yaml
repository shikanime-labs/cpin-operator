apiVersion: pulumi.com/v1
kind: Program
metadata:
  name: cpin-program-vault-install
program:
  name: cpin-vault-install
  runtime: yaml
  resources:
    vault:
      type: kubernetes:helm.sh/v3:Release
      properties:
        name: vault
        namespace: vault
        repositoryOpts:
          repo: https://helm.releases.hashicorp.com
        chart: vault
        version: ${vaultVersion}
  config:
    vaultVersion:
      type: String
