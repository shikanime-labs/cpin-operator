apiVersion: pulumi.com/v1
kind: Program
metadata:
  name: cpin-program-vault
program:
  name: cpin-program-vault
  description: Vault policy and identity-group provisioning from the console vault
    audit
  runtime: yaml
  config:
    projectName:
      type: String
    projectSlug:
      type: String
    projectOwner:
      type: String
  resources:
    appAdminPolicy:
      type: cpin:vault:Artifact
      properties:
        kind: acl-policy
        name: app--${projectSlug}--admin
        policy: 'path "${projectSlug}/*" { capabilities = ["create", "read", "update",
          "delete", "list"] }

          '
    appDevopsPolicy:
      type: cpin:vault:Artifact
      properties:
        kind: acl-policy
        name: project--${projectSlug}--devops
        policy: 'path "${projectSlug}/data/*" { capabilities = ["create", "read",
          "update", "delete", "list"] }

          path "${projectSlug}/metadata/*" { capabilities = ["read", "list"] }

          path "${projectSlug}/delete/*" { capabilities = ["update"] }

          path "${projectSlug}/undelete/*" { capabilities = ["update"] }

          path "${projectSlug}/destroy/*" { capabilities = ["update"] }

          '
    appDeveloperPolicy:
      type: cpin:vault:Artifact
      properties:
        kind: acl-policy
        name: project--${projectSlug}--developer
        policy: 'path "${projectSlug}/data/*" { capabilities = ["list"] }

          '
        options:
          note: console binds the readonly policy body to the developer scope
    platformAdminPolicy:
      type: cpin:vault:Artifact
      properties:
        kind: acl-policy
        name: platform--admin
        policy: 'path "sys/*" { capabilities = ["create", "read", "update", "delete",
          "list", "sudo"] }

          '
    projectAdminGroup:
      type: cpin:vault:Artifact
      properties:
        kind: identity-group
        name: project-${projectSlug}-admin
        type: external
        policies:
        - ${appAdminPolicy.name}
    projectDevopsGroup:
      type: cpin:vault:Artifact
      properties:
        kind: identity-group
        name: project-${projectSlug}-devops
        type: external
        policies:
        - ${appDevopsPolicy.name}
    projectDeveloperGroup:
      type: cpin:vault:Artifact
      properties:
        kind: identity-group
        name: project-${projectSlug}-developer
        type: external
        policies:
        - ${appDeveloperPolicy.name}
    consoleAdminGroup:
      type: cpin:vault:Artifact
      properties:
        kind: identity-group
        name: console-admin
        type: external
        policies:
        - ${platformAdminPolicy.name}
        options:
          note: platform scope; alias path defaults to /console/admin, admin-group-path
            plugin key overrides
    projectAdminAlias:
      type: cpin:vault:Artifact
      properties:
        kind: group-alias
        name: /${projectSlug}/console/admin
        group: ${projectAdminGroup.name}
        mount: oidc/
    projectDevopsAlias:
      type: cpin:vault:Artifact
      properties:
        kind: group-alias
        name: /${projectSlug}/console/devops
        group: ${projectDevopsGroup.name}
        mount: oidc/
    projectDeveloperAlias:
      type: cpin:vault:Artifact
      properties:
        kind: group-alias
        name: /${projectSlug}/console/developer
        group: ${projectDeveloperGroup.name}
        mount: oidc/
    consoleAdminAlias:
      type: cpin:vault:Artifact
      properties:
        kind: group-alias
        name: /console/admin
        group: ${consoleAdminGroup.name}
        mount: oidc/
    installVault:
      type: kubernetes:helm.sh/v3:Release
      properties:
        name: vault
        namespace: vault
        repositoryOpts:
          repo: https://helm.releases.hashicorp.com
        chart: vault
        version: ${vaultVersion}
  outputs:
    policyNames:
    - ${appAdminPolicy.name}
    - ${appDevopsPolicy.name}
    - ${appDeveloperPolicy.name}
    - ${platformAdminPolicy.name}
    groupNames:
    - ${projectAdminGroup.name}
    - ${projectDevopsGroup.name}
    - ${projectDeveloperGroup.name}
    - ${consoleAdminGroup.name}
    aliasPaths:
    - ${projectAdminAlias.name}
    - ${projectDevopsAlias.name}
    - ${projectDeveloperAlias.name}
    - ${consoleAdminAlias.name}
