apiVersion: pulumi.com/v1
kind: Program
metadata:
  name: cpin-program-nexus-install
program:
  name: cpin-nexus-install
  runtime: yaml
  resources:
    nexus:
      type: kubernetes:helm.sh/v3:Release
      properties:
        name: nexus3
        namespace: nexus
        repositoryOpts:
          repo: https://stevehipwell.github.io/helm-charts/
        chart: nexus3
        version: 5.14.0
