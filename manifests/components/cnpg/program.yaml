apiVersion: pulumi.com/v1
kind: Program
metadata:
  name: cpin-program-cnpg
program:
  name: cpin-cnpg
  description: "cnpg install plane \u2014 carved from the socle mega-program"
  runtime: yaml
  config:
    domain:
      type: String
    cnpgVersion:
      type: String
      default: 0.27.0
  resources:
    cnpg:
      type: kubernetes:helm.sh/v3:Release
      properties:
        name: cloudnative-pg
        namespace: cnpg-system
        repositoryOpts:
          repo: https://cloudnative-pg.github.io/charts
        chart: cloudnative-pg
        version: ${cnpgVersion}
