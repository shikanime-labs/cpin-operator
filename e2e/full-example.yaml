apiVersion: cloud-pi-native.fr/v1alpha1
kind: Project
metadata:
  name: detonation
spec:
  slug: detonation
  owner: william@shikanime.studio
  description: e2e full example
---
apiVersion: cloud-pi-native.fr/v1alpha1
kind: Integration
metadata:
  name: detonation-keycloak
  labels:
    cloud-pi-native.fr/project: detonation
spec:
  projectRef:
    group: cloud-pi-native.fr
    kind: Project
    name: detonation
  service: keycloak
  enabled: true
  programRef:
    group: pulumi.com
    kind: Program
    name: cpin-program-keycloak
---
apiVersion: cloud-pi-native.fr/v1alpha1
kind: Environment
metadata:
  name: detonation-dev
  labels:
    cloud-pi-native.fr/project: detonation
spec:
  projectRef:
    group: cloud-pi-native.fr
    kind: Project
    name: detonation
  clusterRef:
    group: cloud-pi-native.fr
    kind: Cluster
    name: nishir
  stageRef:
    group: cloud-pi-native.fr
    kind: Stage
    name: dev
  resources:
    requests:
      cpu: '2'
      memory: 4Gi
      gpu: 0
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: detonation-admin
  labels:
    cloud-pi-native.fr/project: detonation
rules:
  - apiGroups: ["cloud-pi-native.fr"]
    resources: ["projects", "environments", "integrations", "projectsecrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: detonation-developer
  labels:
    cloud-pi-native.fr/project: detonation
rules:
  - apiGroups: ["cloud-pi-native.fr"]
    resources: ["projects", "environments", "integrations", "projectsecrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: detonation-admin
  labels:
    cloud-pi-native.fr/project: detonation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: detonation-admin
subjects:
  - kind: Group
    name: detonation/console/admin
    apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: detonation-developer
  labels:
    cloud-pi-native.fr/project: detonation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: detonation-developer
subjects:
  - kind: Group
    name: detonation/console/developer
    apiGroup: rbac.authorization.k8s.io
