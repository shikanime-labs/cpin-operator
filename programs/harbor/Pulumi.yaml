# Harbor registry provisioning, distilled from the console audit:
# ~/cloud-pi-native-core.operator/docs/audit/harbor.md
# Source of truth: console/apps/server-nestjs/src/modules/registry/
#
# `ensureProject` = project + quota, then parallel: robots, group members, retention.
# Stand-in resource type until the cpin harbor provider exists.
name: cpin-harbor
runtime: yaml
description: Harbor registry provisioning from the console registry audit

config:
  projectName: {type: String}
  projectSlug: {type: String}
  projectOwner: {type: String}

variables:
  # console default: no quotaHardLimit plugin config -> -1 (unlimited)
  storageQuotaBytes: -1

  # harbor.config defaults: robotExpirationDays 90, retention latestPushedK/10,
  # cron 0 22 2 * * *; count 1 when template is 'always'
  robotExpirationDays: 90
  retentionTemplate: latestPushedK
  retentionCount: 10
  retentionCron: "0 22 2 * * *"

  # registry-client.service: roAccess / rwAccess
  roAccess:
    - {resource: repository, action: pull}
    - {resource: artifact, action: read}
  rwAccess:
    - {resource: repository, action: pull}
    - {resource: artifact, action: read}
    - {resource: repository, action: list}
    - {resource: tag, action: list}
    - {resource: artifact, action: list}
    - {resource: scan, action: create}
    - {resource: scan, action: stop}
    - {resource: repository, action: push}
    - {resource: artifact-label, action: create}
    - {resource: artifact-label, action: delete}
    - {resource: tag, action: create}
    - {resource: tag, action: delete}

  # Harbor full robot name is `robot$<slug>+<name>` (registry.service).
  # fn::join because `$${` is Pulumi YAML's escape for a literal `${...}` —
  # a bare "$" can't sit directly before an interpolation.
  robotRoFullName:
    fn::join: ["", ["robot$", "${projectSlug}", "+ro-robot"]]
  robotRwFullName:
    fn::join: ["", ["robot$", "${projectSlug}", "+rw-robot"]]

  # registry.service generateAccessLevelMapping + registry.constants defaults.
  # Role quirk preserved: project /console/admin maps to DEVELOPER(2), NOT
  # PROJECT_ADMIN; only platform /console/admin is PROJECT_ADMIN(1).
  # devops(/maintainer suffix) and developer land on GUEST(3) alongside
  # guests; /<slug> itself is LIMITED_GUEST(5).
  groupMappings:
    - group: /console/admin
      roleId: 1
    - group: /console/security
      roleId: 3
    - group: /console/readonly
      roleId: 3
    - group: /${projectSlug}
      roleId: 5
    - group: /${projectSlug}/console/admin
      roleId: 2
    - group: /${projectSlug}/console/devops
      roleId: 3
    - group: /${projectSlug}/console/developer
      roleId: 3
    - group: /${projectSlug}/console/security
      roleId: 3
    - group: /${projectSlug}/console/readonly
      roleId: 3

resources:
  # Project + storage quota (ensureProjectQuota)
  project:
    type: cpin:harbor:Artifact
    properties:
      kind: project
      name: ${projectSlug}
      owner: ${projectOwner}
      storageQuotaBytes: ${storageQuotaBytes}

  # Robot accounts (ensureRobotSecret x2). Secrets live in Vault in the console;
  # rotation/secret handling is provider-side (rotateRobot), not here.
  robotRo:
    type: cpin:harbor:Artifact
    properties:
      kind: robot
      name: ro-robot
      fullName: ${robotRoFullName}
      description: robot for ci builds
      level: project
      namespace: ${projectSlug}
      durationDays: ${robotExpirationDays}
      access: ${roAccess}

  robotRw:
    type: cpin:harbor:Artifact
    properties:
      kind: robot
      name: rw-robot
      fullName: ${robotRwFullName}
      description: robot for ci builds
      level: project
      namespace: ${projectSlug}
      durationDays: ${robotExpirationDays}
      access: ${rwAccess}

  # Retention: exactly one policy per project, read-then-create idempotent
  # (its duplicate signal is message-only, not gate-reconcilable).
  retention:
    type: cpin:harbor:Artifact
    properties:
      kind: retention
      algorithm: or
      # console scopes retention by numeric harbor projectId; stand-in
      # resource exposes it as id
      scope:
        level: project
        ref: ${project.id}
      rules:
        - action: retain
          disabled: false
          template: ${retentionTemplate}
          params:
            latestPushedK: ${retentionCount}
          tag_selectors:
            - kind: doublestar
              decoration: matches
              pattern: "**"
          scope_selectors:
            repository:
              - kind: doublestar
                decoration: repoMatches
                pattern: "**"
      trigger:
        kind: Schedule
        settings:
          cron: ${retentionCron}
        references: []

  # Group members (ensureProjectGroupMembers): group_type 3 (oidc group)
  groupMembers:
    type: cpin:harbor:Artifact
    properties:
      kind: group-members
      project: ${projectSlug}
      groupType: 3
      members: ${groupMappings}

outputs:
  service: harbor
  projectId: ${project.id}
  robotAccounts:
    - ${robotRoFullName}
    - ${robotRwFullName}
  groupMappings: ${groupMappings}
