# Vault provisioning program for cpin-operator.
#
# Stand-in resources typed cpin:vault:Artifact; a real Vault provider replaces
# them later without changing the desired-state shape. Semantics come from the
# console vault audit (docs/audit/vault.md) and vault.service.ts:
#
# - ACL policies are upsert/replace by name; delete 404-tolerant.
#   app-admin = full CRUD on {slug}/* (mount root). devops = KV-v2 API paths
#   (data/metadata/delete/undelete/destroy). developer = list on {slug}/data/*
#   (console reuses the readonly body for the developer scope).
# - Identity groups `project-{slug}-{scope}` are type=external (members come
#   from OIDC login, never set directly); policies = the matching
#   project/app policy. One group per role path suffix.
# - OIDC group-alias per configured Keycloak path /{slug}/console/{suffix},
#   mount = the realm's oidc/ accessor; 400 on alias create is a benign race.
# - console-admin: platform-scope external group bound to platform--admin,
#   aliased to the admin group path (default /console/admin).
name: cpin-program-vault
description: Vault policy and identity-group provisioning from the console vault audit
runtime: yaml

config:
  projectName:
    type: String
  projectSlug:
    type: String
  projectOwner:
    type: String

resources:
  # ACL policies — POST /v1/sys/policies/acl/{name} is upsert/replace.
  appAdminPolicy:
    type: cpin:vault:Artifact
    properties:
      kind: acl-policy
      name: "app--${projectSlug}--admin"
      policy: |
        path "${projectSlug}/*" { capabilities = ["create", "read", "update", "delete", "list"] }

  appDevopsPolicy:
    type: cpin:vault:Artifact
    properties:
      kind: acl-policy
      name: "project--${projectSlug}--devops"
      policy: |
        path "${projectSlug}/data/*" { capabilities = ["create", "read", "update", "delete", "list"] }
        path "${projectSlug}/metadata/*" { capabilities = ["read", "list"] }
        path "${projectSlug}/delete/*" { capabilities = ["update"] }
        path "${projectSlug}/undelete/*" { capabilities = ["update"] }
        path "${projectSlug}/destroy/*" { capabilities = ["update"] }

  appDeveloperPolicy:
    type: cpin:vault:Artifact
    properties:
      kind: acl-policy
      name: "project--${projectSlug}--developer"
      policy: |
        path "${projectSlug}/data/*" { capabilities = ["list"] }
      options:
        note: console binds the readonly policy body to the developer scope

  platformAdminPolicy:
    type: cpin:vault:Artifact
    properties:
      kind: acl-policy
      name: platform--admin
      policy: |
        path "sys/*" { capabilities = ["create", "read", "update", "delete", "list", "sudo"] }

  # Identity groups — type=external, one per role path suffix; policies =
  # matching policy. Members arrive via OIDC login; never set directly.
  projectAdminGroup:
    type: cpin:vault:Artifact
    properties:
      kind: identity-group
      name: "project-${projectSlug}-admin"
      type: external
      policies: ["${appAdminPolicy.name}"]

  projectDevopsGroup:
    type: cpin:vault:Artifact
    properties:
      kind: identity-group
      name: "project-${projectSlug}-devops"
      type: external
      policies: ["${appDevopsPolicy.name}"]

  projectDeveloperGroup:
    type: cpin:vault:Artifact
    properties:
      kind: identity-group
      name: "project-${projectSlug}-developer"
      type: external
      policies: ["${appDeveloperPolicy.name}"]

  consoleAdminGroup:
    type: cpin:vault:Artifact
    properties:
      kind: identity-group
      name: console-admin
      type: external
      policies: ["${platformAdminPolicy.name}"]
      options:
        note: platform scope; alias path defaults to /console/admin, admin-group-path plugin key overrides

  # OIDC group aliases — alias name = Keycloak group path, mount = oidc/.
  # 400 on create is a benign race (alias already bound); deletes tolerate 404.
  projectAdminAlias:
    type: cpin:vault:Artifact
    properties:
      kind: group-alias
      name: "/${projectSlug}/console/admin"
      group: "${projectAdminGroup.name}"
      mount: oidc/

  projectDevopsAlias:
    type: cpin:vault:Artifact
    properties:
      kind: group-alias
      name: "/${projectSlug}/console/devops"
      group: "${projectDevopsGroup.name}"
      mount: oidc/

  projectDeveloperAlias:
    type: cpin:vault:Artifact
    properties:
      kind: group-alias
      name: "/${projectSlug}/console/developer"
      group: "${projectDeveloperGroup.name}"
      mount: oidc/

  consoleAdminAlias:
    type: cpin:vault:Artifact
    properties:
      kind: group-alias
      name: /console/admin
      group: "${consoleAdminGroup.name}"
      mount: oidc/

outputs:
  policyNames:
    - "${appAdminPolicy.name}"
    - "${appDevopsPolicy.name}"
    - "${appDeveloperPolicy.name}"
    - "${platformAdminPolicy.name}"
  groupNames:
    - "${projectAdminGroup.name}"
    - "${projectDevopsGroup.name}"
    - "${projectDeveloperGroup.name}"
    - "${consoleAdminGroup.name}"
  aliasPaths:
    - "${projectAdminAlias.name}"
    - "${projectDevopsAlias.name}"
    - "${projectDeveloperAlias.name}"
    - "${consoleAdminAlias.name}"
