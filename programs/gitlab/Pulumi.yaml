# GitLab provisioning program for cpin-operator.
#
# Stand-in resources typed cpin:gitlab:Artifact; a real GitLab provider
# replaces them later without changing the desired-state shape. Semantics come
# from the console gitlab audit (docs/audit/gitlab.md):
#
# - Project subgroup {PROJECTS_ROOT_DIR}/{slug}: get-or-create with collision
#   reload; custom attribute cpn_project_slug; no per-role subgroups.
# - Mirror robot: bot account for repo mirroring, age-based token rotation
#   (rotate when age crosses a config-enforced threshold set below expiry).
# - Role group shares: config-driven OIDC group paths -> AccessLevel
#   (defaults admin->50, devops->40, developer->30, readonly->10; overridable).
# - Instance flags: admin/auditor authoritative-mapped from admin-role group
#   paths (member->true, non-member->false, empty mapping->undefined no-op).
name: cpin-program-gitlab
description: GitLab group provisioning from the console gitlab audit
runtime: yaml

config:
  projectName:
    type: String
  projectSlug:
    type: String
  projectOwner:
    type: String

resources:
  # {root}/{slug} — project subgroup under the PROJECTS_ROOT_DIR root group.
  projectGroup:
    type: cpin:gitlab:Artifact
    properties:
      kind: group
      path: "/${projectSlug}"
      options:
        note: get-or-create with collision reload; custom attribute cpn_project_slug; no per-role subgroups

  # Mirror robot — bot account for repository mirroring.
  mirrorRobot:
    type: cpin:gitlab:Artifact
    properties:
      kind: mirror-robot
      group: "${projectGroup.path}"
      options:
        tokenRotation:
          strategy: age-based
          rotateWhen: token age crosses threshold
          note: threshold config-enforced, always below token expiry

  # Role group shares — OIDC role groups shared into the project group with
  # their access level. Console defaults; overridable via plugin config.
  adminShare:
    type: cpin:gitlab:Artifact
    properties:
      kind: group-share
      group: "${projectGroup.path}"
      sharedWithGroupPath: "/${projectSlug}/console/admin"
      groupAccessLevel: 50 # owner

  devopsShare:
    type: cpin:gitlab:Artifact
    properties:
      kind: group-share
      group: "${projectGroup.path}"
      sharedWithGroupPath: "/${projectSlug}/console/devops"
      groupAccessLevel: 40 # maintainer

  developerShare:
    type: cpin:gitlab:Artifact
    properties:
      kind: group-share
      group: "${projectGroup.path}"
      sharedWithGroupPath: "/${projectSlug}/console/developer"
      groupAccessLevel: 30 # developer

  readonlyShare:
    type: cpin:gitlab:Artifact
    properties:
      kind: group-share
      group: "${projectGroup.path}"
      sharedWithGroupPath: "/${projectSlug}/console/readonly"
      groupAccessLevel: 10 # guest

  # Instance flags — admin/auditor per user, authoritative from admin-role
  # group paths. Console defaults for the paths; overridable via plugin config.
  instanceFlags:
    type: cpin:gitlab:Artifact
    properties:
      kind: instance-flags
      users: ["${projectOwner}"]
      admin:
        groupPaths:
          - /admin
      auditor:
        groupPaths:
          - /console/readonly
          - /console/security
      options:
        note: member->true, non-member->false, empty mapping->undefined no-op

outputs:
  projectGroupPath: "${projectGroup.path}"
  mirrorRobotId: "${mirrorRobot.id}"
  roleGroupAccessLevels:
    admin: "${adminShare.groupAccessLevel}"
    devops: "${devopsShare.groupAccessLevel}"
    developer: "${developerShare.groupAccessLevel}"
    readonly: "${readonlyShare.groupAccessLevel}"
